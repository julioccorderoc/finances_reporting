{# Stacked-bar chart for /monthly. Chart.js via the vendored UMD.

   The payload rides in a <script type="application/json"> block, never in
   an attribute: tojson emits double quotes, which end the attribute and
   truncate the JSON while every server-side test stays green. A tiny
   inline <script> instantiates the chart; a bar click drills into
   /transactions for that month and kind.

   Colour is the categorical palette from signal.css (--series-1..5), not
   the ink ramp. Gray is a magnitude channel: stacked as six steps it put
   the worst adjacent pair 9.0 apart in OKLab against a floor of 15, so
   two categories could not be told apart by colour at all. The five hues
   clear every separation check on every pair. The slot each series takes
   is decided server-side (``color_slot``) on a ranking the category
   filter cannot move, so narrowing the chart never repaints it. "Other"
   keeps the neutral: it is a remainder, not a thing that happened.

   The BCV-fallback shadow is still the one red on the chart — the part of
   a month only BCV could price (rule-005).

   The reading on hover is a DOM overlay, not Chart.js's in-canvas
   tooltip: the canvas one cannot be styled to the sheet, clips against
   the plot floor (the bug triage's rate reading hit), and listed the
   month in stack order with no total and no shares. This one ranks the
   month by size, gives each row its share, and opens "Other" — which on a
   real ledger is routinely the largest block on the chart.

   The drawing script lives INSIDE the section: the pivot partial carries
   this file as an out-of-band twin (`chart_oob`) when the filters change,
   and htmx re-runs only the scripts inside the element it swaps. The
   overlay node lives inside it for the same reason — parked outside, it
   survives the swap as an orphan the re-run script never binds. The
   previous Chart instance is destroyed first — it was bound to the canvas
   this swap replaces.
#}
<section id="monthly-chart" class="rpt-chart-card"{% if chart_oob is defined and chart_oob %} hx-swap-oob="true"{% endif %}>
  <div class="rpt-chart">
    <canvas data-monthly-chart aria-label="Totals by category and month"></canvas>
    <div data-monthly-tip class="rpt-chart-tip mth-tip" hidden></div>
  </div>
  <script id="monthly-chart-data" type="application/json">
  {
    "months": {{ chart.months | tojson }},
    "series": [
      {%- for s in chart.series -%}
        {"category": {{ s.category | tojson }}, "slot": {{ s.color_slot }}, "values": [{% for v in s.values %}{{ v }}{% if not loop.last %},{% endif %}{% endfor %}]}{% if not loop.last %},{% endif %}
      {%- endfor -%}
    ],
    "other_members": [
      {%- for s in chart.other_members -%}
        {"category": {{ s.category | tojson }}, "values": [{% for v in s.values %}{{ v }}{% if not loop.last %},{% endif %}{% endfor %}]}{% if not loop.last %},{% endif %}
      {%- endfor -%}
    ],
    "fallback_per_month": [{% for v in chart.fallback_per_month %}{{ v }}{% if not loop.last %},{% endif %}{% endfor %}],
    "kind": {{ chart.filter.kind.value | tojson }}
  }
  </script>

<script>
(function () {
  if (typeof window === 'undefined' || !window.Chart) return;
  var section = document.getElementById('monthly-chart');
  var dataEl = document.getElementById('monthly-chart-data');
  if (!section || !dataEl) return;
  var canvas = section.querySelector('canvas[data-monthly-chart]');
  if (!canvas || canvas.dataset.bound === 'true') return;
  canvas.dataset.bound = 'true';
  var tipEl = section.querySelector('[data-monthly-tip]');
  var payload;
  try { payload = JSON.parse(dataEl.textContent); } catch (e) { return; }
  if (window.__monthlyChart) {
    try { window.__monthlyChart.destroy(); } catch (e) {}
    window.__monthlyChart = null;
  }

  // signal.css's tokens, read once, so the chart cannot drift from the sheet.
  //
  // Every read carries the sheet's own value as a fallback, and that is not
  // belt-and-braces: a browser holding a cached signal.css older than this
  // template resolves the custom property to '', and a dataset whose
  // backgroundColor is undefined is drawn by Chart.js in its default faint
  // gray. The chart then renders with no colour at all and nothing anywhere
  // reports an error. Keep these literals in step with signal.css —
  // tests/web/test_monthly_chart_palette.py fails if they drift.
  var styles = getComputedStyle(document.documentElement);
  function tok(name, fallback) {
    var value = styles.getPropertyValue(name).trim();
    return value || fallback;
  }
  var series = [
    tok('--series-1', '#1f8fc4'),
    tok('--series-2', '#a58515'),
    tok('--series-3', '#63509f'),
    tok('--series-4', '#1f7032'),
    tok('--series-5', '#cc6e8b')
  ];
  var neutral = tok('--series-other', '#c7c6c0');
  var paper = tok('--surface-raised', '#f5f5f3');
  var grid = tok('--border-subtle', '#dbdad5');
  var tick = tok('--text-tertiary', '#666662');
  var mono = "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace";

  function colorFor(slot) {
    if (slot === null || slot === undefined || slot < 0) return neutral;
    return series[slot % series.length] || neutral;
  }

  // Dimming the months you are not reading. Chart.js has no opacity channel
  // per element, so the fill itself is mixed toward paper — color-mix keeps
  // it in the sheet's own colour space rather than guessing an rgba.
  function dimmed(color) {
    return 'color-mix(in srgb, ' + color + ' 26%, ' + paper + ')';
  }

  // Which month the pointer is over, or null. Scriptable colours read it, so
  // a hover is one update() with no re-layout.
  var hovered = null;

  function fillFor(base) {
    return function (ctx) {
      if (hovered === null || ctx.dataIndex === undefined) return base;
      return ctx.dataIndex === hovered ? base : dimmed(base);
    };
  }

  var datasets = (payload.series || []).map(function (s) {
    var base = colorFor(s.slot);
    return {
      label: s.category,
      data: s.values,
      backgroundColor: fillFor(base),
      borderColor: paper,
      borderWidth: 1,
      stack: 'stack-a'
    };
  });
  var hasFallback = (payload.fallback_per_month || []).some(function (v) { return Number(v) !== 0; });
  if (hasFallback) {
    datasets.push({
      label: 'BCV fallback',
      data: payload.fallback_per_month,
      backgroundColor: fillFor(tok('--red-050', '#fbe9e8')),
      borderColor: tok('--red-600', '#c51a13'),
      borderWidth: 1,
      stack: 'stack-b'
    });
  }

  // ── the reading ────────────────────────────────────────────────────────
  var money = new Intl.NumberFormat('en-US', {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
  function fmt(v) {
    var n = Number(v);
    return (n < 0 ? '-$' : '$') + money.format(Math.abs(n));
  }
  function pct(part, whole) {
    if (!whole) return '';
    return (Math.abs(part) / Math.abs(whole) * 100).toFixed(1) + '%';
  }

  function row(color, name, value, share) {
    return '<i class="mth-tip-chip" style="background:' + color + '"></i>'
      + '<span class="mth-tip-row">' + name + '</span>'
      + '<span class="mth-tip-num">' + fmt(value) + '</span>'
      + '<span class="mth-tip-share">' + share + '</span>';
  }

  function render(index) {
    var month = (payload.months || [])[index];
    if (!month) return '';

    var rows = (payload.series || []).map(function (s) {
      return { name: s.category, value: Number(s.values[index]), color: colorFor(s.slot) };
    }).filter(function (r) { return r.value !== 0; });

    var total = rows.reduce(function (a, r) { return a + r.value; }, 0);
    // Ranked by size, because the question on hover is what the month was
    // made of — stack order answers a different question.
    rows.sort(function (a, b) { return Math.abs(b.value) - Math.abs(a.value); });

    var html = '<p class="mth-tip-head"><span>' + month + '</span>'
      + '<span>' + fmt(total) + '</span></p>';
    html += '<div class="mth-tip-rows">';
    rows.forEach(function (r) {
      html += row(r.color, r.name, r.value, pct(r.value, total));
      // Open the remainder in place. The cap hides most of the ledger
      // otherwise: Other is often the biggest block on the chart.
      if (r.name === 'Other') {
        var members = (payload.other_members || []).map(function (m) {
          return { name: m.category, value: Number(m.values[index]) };
        }).filter(function (m) { return m.value !== 0; });
        members.sort(function (a, b) { return Math.abs(b.value) - Math.abs(a.value); });
        members.forEach(function (m) {
          html += '<i></i>'
            + '<span class="mth-tip-row is-member">' + m.name + '</span>'
            + '<span class="mth-tip-num is-member">' + fmt(m.value) + '</span>'
            + '<span class="mth-tip-share">' + pct(m.value, total) + '</span>';
        });
      }
    });
    html += '</div>';

    var fb = Number((payload.fallback_per_month || [])[index] || 0);
    if (fb !== 0) {
      html += '<p class="mth-tip-foot">BCV-priced ' + fmt(fb)
        + ' · ' + pct(fb, total) + ' of the month</p>';
    }
    return html;
  }

  // Chart.js hands us its tooltip model; we draw our own node from it. The
  // bubble is placed on the far side of the column it describes so it never
  // covers the bars being read.
  function renderTip(context) {
    var model = context.tooltip;
    if (!model || model.opacity === 0) {
      if (hovered !== null) { hovered = null; context.chart.update('none'); }
      tipEl.hidden = true;
      return;
    }
    var index = model.dataPoints && model.dataPoints.length
      ? model.dataPoints[0].dataIndex
      : null;
    if (index === null) return;
    if (index !== hovered) {
      hovered = index;
      tipEl.innerHTML = render(index);
      // update() re-enters this callback; the guard above stops the loop.
      context.chart.update('none');
    }
    tipEl.hidden = false;

    var area = context.chart.chartArea;
    var onLeft = model.caretX > (area.left + area.right) / 2;
    tipEl.style.left = onLeft ? '' : 'auto';
    tipEl.style.right = onLeft ? 'auto' : '';
    if (onLeft) { tipEl.style.left = (area.left + 4) + 'px'; }
    else { tipEl.style.right = '4px'; }
    tipEl.style.top = (area.top + 4) + 'px';
  }

  window.__monthlyChart = new window.Chart(canvas, {
    type: 'bar',
    data: { labels: payload.months || [], datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: {
          stacked: true,
          grid: { display: false },
          border: { color: grid },
          ticks: { color: tick, font: { family: mono, size: 11 } }
        },
        y: {
          stacked: true,
          grid: { color: grid },
          border: { display: false },
          ticks: { color: tick, font: { family: mono, size: 11 } }
        }
      },
      plugins: {
        legend: {
          position: 'bottom',
          labels: { boxWidth: 10, boxHeight: 10, color: tick, font: { family: mono, size: 11 } }
        },
        tooltip: { enabled: false, external: renderTip }
      },
      onClick: function (evt) {
        var pts = this.getElementsAtEventForMode(evt, 'index', { intersect: false }, true);
        if (!pts || !pts.length) return;
        var idx = pts[0].index;
        var month = (payload.months || [])[idx];
        if (!month) return;
        var df = month + '-01';
        var url = '/transactions?date_from=' + encodeURIComponent(df) +
                  '&kinds=' + encodeURIComponent(payload.kind || 'expense');
        window.location.href = url;
      }
    }
  });

  // The canvas keeps no pointerleave of its own once the tooltip is ours.
  canvas.addEventListener('mouseleave', function () {
    if (hovered !== null) { hovered = null; window.__monthlyChart.update('none'); }
    tipEl.hidden = true;
  });
})();
</script>
</section>
