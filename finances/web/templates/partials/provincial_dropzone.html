{# Drop a Provincial statement straight onto the page (WP3).

   The file input is the real control; the drop area sits on top of it via its
   <label>, so click and keyboard both work with no JS at all — Alpine only
   adds the drag highlight and the drop-to-fill shortcut.

   A raised panel behind a <details>; the summary is a control row with the
   upload glyph; the drop area is a dashed hairline on the canvas that goes
   strong-bordered and raised while a file is over it. Styles: .flow-upload-*
   and .flow-drop* in static/css/flow.css.
#}
{% from "_icons.html" import icon %}
<section class="flow-upload" data-provincial-dropzone>
  {# The rail's "Upload a statement" lands here as /transactions?upload=1#upload
     and expects the panel open on arrival. #}
  <details class="flow-upload-panel" id="upload"{% if request.query_params.get("upload") %} open{% endif %}>
    <summary class="flow-upload-summary">
      {{ icon("upload", 16) }}
      <span>Import a Provincial statement</span>
      <span class="flow-upload-chevron">{{ icon("chevron-down", 14) }}</span>
    </summary>

    <div class="flow-upload-body">
      <form
        id="provincial-upload-form"
        hx-post="/_partial/uploads/provincial/preview"
        hx-encoding="multipart/form-data"
        hx-target="#upload-result"
        hx-swap="innerHTML"
      >
        <label
          class="flow-drop"
          x-data="{ over: false }"
          x-bind:class="over && 'is-over'"
          x-on:dragover.prevent="over = true"
          x-on:dragleave.prevent="over = false"
          x-on:drop.prevent="
            over = false;
            $refs.file.files = $event.dataTransfer.files;
            $refs.file.dispatchEvent(new Event('change', { bubbles: true }));
          "
        >
          <input
            type="file"
            name="file"
            accept=".csv,.xls"
            class="flow-drop-input"
            x-ref="file"
            hx-trigger="change"
            hx-post="/_partial/uploads/provincial/preview"
            hx-encoding="multipart/form-data"
            hx-target="#upload-result"
            hx-swap="innerHTML"
            hx-include="closest form"
          >
          <span class="flow-drop-line">Drop the file here, or click to choose</span>
          <span class="flow-drop-hint">
            .csv or .xls straight from the bank &mdash; the name doesn't matter.
            Nothing is written until you confirm.
          </span>
        </label>
      </form>

      <div id="upload-result" aria-live="polite"></div>
    </div>
  </details>
</section>
