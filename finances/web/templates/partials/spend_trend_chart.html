{# 6-month stacked-bar spend chart.
   Context: ``trend`` (services.dashboard.SpendTrend).

   Markup-only: the canvas carries a ``data-chart`` attribute with the
   serialized payload, and a small <script> reads it and initializes
   Chart.js (loaded via base.html).
#}
{%- set _palette = [
  '#0ea5e9', '#10b981', '#f59e0b', '#a855f7', '#ef4444', '#94a3b8'
] -%}
{%- set _datasets = [] -%}
{%- for s in trend.series -%}
  {%- set _color = _palette[loop.index0 % (_palette | length)] -%}
  {%- set _values_str = [] -%}
  {%- for v in s.values -%}
    {%- set _ = _values_str.append(v|string) -%}
  {%- endfor -%}
  {%- set _ = _datasets.append({
    'label': s.category,
    'data': _values_str,
    'backgroundColor': _color,
    'borderColor': _color,
    'borderWidth': 1,
    'stack': 'spend',
  }) -%}
{%- endfor -%}
{%- set _fallback_str = [] -%}
{%- for v in trend.fallback_total_per_month -%}
  {%- set _ = _fallback_str.append(v|string) -%}
{%- endfor -%}
{%- set _payload = {
  'months': trend.months,
  'datasets': _datasets,
  'fallback_total_per_month': _fallback_str,
} -%}

<section aria-labelledby="spend-trend-heading">
  <header class="mb-2 flex items-baseline justify-between">
    <h2 id="spend-trend-heading" class="text-lg font-semibold">
      Spend by category — last 6 months
    </h2>
    <span class="text-xs text-slate-500">
      Click a bar to drill into that month
    </span>
  </header>

  <div class="rounded-lg border border-slate-200 bg-white p-4">
    <div class="spend-chart">
      <canvas
        id="spend-trend-chart"
        data-chart='{{ _payload | tojson }}'
      ></canvas>
    </div>
  </div>
</section>

<script>
  (function () {
    var canvas = document.getElementById('spend-trend-chart');
    if (!canvas || typeof Chart === 'undefined') { return; }
    var raw = canvas.getAttribute('data-chart');
    if (!raw) { return; }
    var payload;
    try { payload = JSON.parse(raw); } catch (e) { return; }
    var datasets = (payload.datasets || []).map(function (d) {
      return {
        label: d.label,
        data: (d.data || []).map(function (v) { return Number(v); }),
        backgroundColor: d.backgroundColor,
        borderColor: d.borderColor,
        borderWidth: d.borderWidth,
        stack: d.stack || 'spend'
      };
    });
    var months = payload.months || [];
    var chart = new Chart(canvas.getContext('2d'), {
      type: 'bar',
      data: { labels: months, datasets: datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { stacked: true },
          y: { stacked: true, beginAtZero: true }
        },
        plugins: {
          legend: { position: 'bottom' },
          tooltip: { mode: 'index', intersect: false }
        },
        onClick: function (evt, els) {
          if (!els || els.length === 0) { return; }
          var idx = els[0].index;
          var month = months[idx];
          if (!month) { return; }
          window.location.href =
            '/monthly?since=' + encodeURIComponent(month) +
            '&until=' + encodeURIComponent(month);
        }
      }
    });
    canvas.__finances_chart = chart;
  })();
</script>
