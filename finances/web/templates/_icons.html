   https://github.com/lucide-icons/lucide. Path data copied verbatim from tag
   0.469.0; only the <svg> wrapper is ours.

   Inlined rather than sprited or fetched: the viewer is offline-first, an
   inline <svg> inherits `currentColor` from whatever it sits in, and there is
   no build step in this project to run over an icon package.

     {% from "_icons.html" import icon %}
     {{ icon("archive", 15) }}

   The signature is a pinned cross-session contract: icon(name, size) where
   `name` is the Lucide kebab-case name and `size` is a pixel number applied to
   width/height. The 24x24 viewBox, stroke="currentColor" and stroke-width="2"
   never change — SIGNAL uses one stroke weight at every size (10-17px in the
   UI, 28px in the empty state).

   An unknown name renders NOTHING, deliberately: a missing icon must not blow
   up a page mid-triage, and a hole is easier to spot in review than a
   fallback glyph that looks intentional.

   Generated. To add an icon, take its path data from the Lucide repo at the
   tag above and add a row to ICONS, keeping the list alphabetical.
#}

{%- macro icon(name, size=16) -%}
{%- set paths = ICONS.get(name) -%}
{%- if paths -%}
<svg xmlns="http://www.w3.org/2000/svg" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="{{ name }}">{{ paths | safe }}</svg>
{%- endif -%}
{%- endmacro -%}
